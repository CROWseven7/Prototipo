<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sem nome</title>
</head>

<body class="bg-black m-0 overflow-hidden h-screen w-screen flex items-center justify-center">
  <div id="app" class="relative w-screen h-screen bg-black overflow-hidden font-sans">
    
    <div id="game-container" class="w-screen h-screen"></div>

    <div id="main-menu-ui" class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
      <h1 class="text-6xl font-thin text-cyan-100 tracking-[1.5rem] mb-20 opacity-80 uppercase italic">
        SEM NOME
      </h1>

      <nav class="flex flex-col gap-6 pointer-events-auto">
        <button class="menu-btn">Single Player</button>
        <button class="menu-btn">Multiplayer Coop</button>
        <button class="menu-btn">Ranking</button>
        <button class="menu-btn">Opções</button>
      </nav>
    </div>

    <div id="global-controls">
        <button id="fullscreen-btn"
          class="absolute bottom-8 right-24 p-3 rounded-full border border-cyan-900/50 text-cyan-400 hover:bg-cyan-900/20 transition-all pointer-events-auto">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
              d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
          </svg>
        </button>

        <button id="mute-btn"
          class="absolute bottom-8 right-8 p-3 rounded-full border border-cyan-900/50 text-cyan-400 hover:bg-cyan-900/20 transition-all pointer-events-auto">
          <svg id="sound-on" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
            stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
              d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
          </svg>
        </button>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>

</html>
